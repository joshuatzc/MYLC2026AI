services:
  # ── Night Games Bot + Admin API ─────────────────────────────────────────────
  mylc-bot:
    build: .
    container_name: mylc-bot
    restart: unless-stopped

    # Load secrets from your .env file — never commit .env to git!
    env_file:
      - .env

    # Override DATABASE_URL to point inside the persistent /data volume
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/church_game.db

    ports:
      # Expose the admin API (optional — remove if you don't need external access)
      - "8000:8000"

    volumes:
      # Persists church_game.db across restarts and redeployments
      - mylc_data:/data

    # Health check — Container Manager will show green/red status
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Day Bot (Ice Breaker Scorer) ─────────────────────────────────────────────
  # Same image, different entry point — shares the same SQLite database volume.
  # The scorer uses this bot on Telegram during the ice breaker day to enter results.
  # You (Ethan) still use scripts/icebreaker.sh via SSH for the final confirmation.
  mylc-day-bot:
    build: .
    container_name: mylc-day-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/church_game.db

    volumes:
      # Same shared volume — both bots read/write one database file
      - mylc_data:/data

    # Override the default CMD (uvicorn) with the day bot polling script
    command: ["python", "-m", "app.day_bot_runner"]

    # No port exposure needed — this container only polls Telegram
    depends_on:
      - mylc-bot

  # ── Cloudflare Tunnel (Secure Public URL) ───────────────────────────────────
  # Exposes the dashboard to the internet securely without port forwarding.
  # Choose ONE of the following modes:
  #
  # MODE A: Quick Tunnel (No Cloudflare account needed. Generates a random public URL in logs).
  # To view the URL, run: docker compose logs mylc-tunnel
  mylc-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mylc-tunnel
    restart: unless-stopped
    command: tunnel --url http://mylc-bot:8000
    depends_on:
      - mylc-bot

  # MODE B: Permanent Named Tunnel (Requires Cloudflare Zero Trust account + Domain).
  # 1. Create a tunnel in the Cloudflare Zero Trust Dashboard.
  # 2. Add CLOUDFLARE_TUNNEL_TOKEN=your_token in your .env file.
  # 3. Comment out MODE A above, and uncomment MODE B below.
  # mylc-tunnel-prod:
  #   image: cloudflare/cloudflared:latest
  #   container_name: mylc-tunnel-prod
  #   restart: unless-stopped
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   command: tunnel run
  #   depends_on:
  #     - mylc-bot

volumes:
  mylc_data:
    driver: local

